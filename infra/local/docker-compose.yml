name: v1

services:
  redis:
    image: redis:8.2.0
    # Job queues need Redis to keep every key, so it never evicts under memory pressure.
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "8000:6379"
    volumes:
      - ./.data/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18
    ports:
      - "8001:5432"
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Postgres keeps each major version's data in its own subdirectory, such as `18/docker`.
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `mini` runs master, volume, filer, and the S3 gateway in one process.
  # The AWS keys become the admin identity when no s3 config file is mounted.
  # `-bucket` creates `uploads` after S3 is listening. `/status` answers before
  # that directory exists, so the healthcheck waits for the bucket too.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    ports:
      - "8002:8333"
    environment:
      AWS_ACCESS_KEY_ID: seaweedfs
      AWS_SECRET_ACCESS_KEY: seaweedfs
    volumes:
      - ./.data/seaweedfs:/data
    command: ["mini", "-dir=/data", "-bucket=uploads"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --output /dev/null http://127.0.0.1:8333/status && curl --fail --silent --output /dev/null http://127.0.0.1:8888/buckets/uploads/",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8004:1025"
      - "8005:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  inngest:
    image: inngest/inngest:v1.45.1
    command: inngest dev --no-discovery
    ports:
      - "8006:8288"
      - "8007:8289"
